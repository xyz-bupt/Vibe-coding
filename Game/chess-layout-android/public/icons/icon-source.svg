<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c41e3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a01830;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGradient)" filter="url(#shadow)"/>

  <!-- 象棋棋盘外框 -->
  <rect x="88" y="88" width="336" height="336" rx="16" fill="none" stroke="#d4af37" stroke-width="8"/>

  <!-- 楚河汉界 -->
  <line x1="88" y1="256" x2="424" y2="256" stroke="#d4af37" stroke-width="4" stroke-dasharray="12,8"/>

  <!-- 九宫格 - 上方 -->
  <line x1="200" y1="88" x2="296" y2="168" stroke="#d4af37" stroke-width="3"/>
  <line x1="296" y1="88" x2="200" y2="168" stroke="#d4af37" stroke-width="3"/>

  <!-- 九宫格 - 下方 -->
  <line x1="200" y1="344" x2="296" y2="424" stroke="#d4af37" stroke-width="3"/>
  <line x1="296" y1="344" x2="200" y2="424" stroke="#d4af37" stroke-width="3"/>

  <!-- 将帅棋子 - 红方帅 -->
  <circle cx="248" cy="384" r="28" fill="#8b0000" stroke="#d4af37" stroke-width="4"/>
  <text x="248" y="393" font-family="serif" font-size="32" font-weight="bold" fill="#ffd700" text-anchor="middle">帅</text>

  <!-- 将帅棋子 - 黑方将 -->
  <circle cx="248" cy="128" r="28" fill="#1a1a1a" stroke="#d4af37" stroke-width="4"/>
  <text x="248" y="137" font-family="serif" font-size="32" font-weight="bold" fill="#ffd700" text-anchor="middle">将</text>

  <!-- 炮棋子 - 红方炮 -->
  <circle cx="168" cy="296" r="24" fill="#8b0000" stroke="#d4af37" stroke-width="3"/>
  <text x="168" y="304" font-family="serif" font-size="28" font-weight="bold" fill="#ffd700" text-anchor="middle">炮</text>

  <!-- 炮棋子 - 黑方炮 -->
  <circle cx="344" cy="216" r="24" fill="#1a1a1a" stroke="#d4af37" stroke-width="3"/>
  <text x="344" y="224" font-family="serif" font-size="28" font-weight="bold" fill="#ffd700" text-anchor="middle">炮</text>

  <!-- 装饰点 -->
  <circle cx="120" cy="120" r="6" fill="#d4af37" opacity="0.6"/>
  <circle cx="392" cy="120" r="6" fill="#d4af37" opacity="0.6"/>
  <circle cx="120" cy="392" r="6" fill="#d4af37" opacity="0.6"/>
  <circle cx="392" cy="392" r="6" fill="#d4af37" opacity="0.6"/>
</svg>

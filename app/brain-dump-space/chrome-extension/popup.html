<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>闪念胶囊</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="background">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
  </div>
  
  <div class="glass-container">
    <header class="header">
      <h1 class="title">✦ 闪念胶囊</h1>
      <div class="stats">
        <span id="thoughtCount">0</span> 条闪念
      </div>
    </header>

    <main class="main">
      <textarea 
        id="input" 
        class="input" 
        placeholder="记录此刻的想法..."
        rows="3"
      ></textarea>

      <div class="tags-preview" id="tagsPreview"></div>

      <div class="actions">
        <button id="saveBtn" class="btn btn-primary">
          <span class="btn-text">保存</span>
        </button>
        <button id="settingsBtn" class="btn btn-icon" title="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m8.48 8.48 4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m8.48-8.48 4.24-4.24"/>
          </svg>
        </button>
      </div>
    </main>

    <div class="recent-section" id="recentSection">
      <h3 class="section-title">最近</h3>
      <div class="thought-list" id="thoughtList"></div>
    </div>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal glass-modal">
      <header class="modal-header">
        <h2>设置</h2>
        <button class="close-btn" id="closeSettings">✕</button>
      </header>
      <div class="modal-body">
        <div class="setting-item">
          <label>使用 AI 分析</label>
          <label class="toggle">
            <input type="checkbox" id="useRealAI">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <label>API 端点</label>
          <input type="text" id="apiUrl" placeholder="https://your-api-url/v1" class="input-field">
        </div>
        <div class="setting-item">
          <label>模型名称</label>
          <input type="text" id="modelName" placeholder="your-model-name" class="input-field">
        </div>
        <div class="setting-item">
          <label>API Key</label>
          <input type="password" id="apiKey" placeholder="sk-..." class="input-field">
        </div>
        <div class="setting-item">
          <label>数据导出</label>
          <button id="exportBtn" class="btn btn-small">导出数据</button>
        </div>
        <div class="setting-item danger">
          <label>危险操作</label>
          <button id="clearBtn" class="btn btn-danger">清空数据</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/analyzer.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="eyeGradientActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pupilGradientActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#047857;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#065F46;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#eyeGradientActive)" opacity="0.2"/>

  <!-- Outer eye shape with glow -->
  <ellipse cx="64" cy="64" rx="48" ry="28" fill="none" stroke="url(#eyeGradientActive)" stroke-width="4" filter="url(#glow)"/>

  <!-- Iris -->
  <circle cx="64" cy="64" r="18" fill="url(#pupilGradientActive)"/>

  <!-- Pupil -->
  <circle cx="64" cy="64" r="9" fill="#022C22"/>

  <!-- Highlight -->
  <circle cx="70" cy="58" r="4" fill="white" opacity="0.9"/>

  <!-- Focus indicators -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#eyeGradientActive)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#eyeGradientActive)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- Eyelashes - top -->
  <path d="M 16 64 Q 8 56 12 48" stroke="url(#eyeGradientActive)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 32 64 Q 24 52 28 44" stroke="url(#eyeGradientActive)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 48 64 Q 44 50 48 42" stroke="url(#eyeGradientActive)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 64 64 Q 64 48 68 40" stroke="url(#eyeGradientActive)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 80 64 Q 84 50 80 42" stroke="url(#eyeGradientActive)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 96 64 Q 104 52 100 44" stroke="url(#eyeGradientActive)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 112 64 Q 120 56 116 48" stroke="url(#eyeGradientActive)" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>

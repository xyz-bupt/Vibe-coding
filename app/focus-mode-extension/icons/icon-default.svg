<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pupilGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E5C8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3E5E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#eyeGradient)" opacity="0.15"/>

  <!-- Outer eye shape -->
  <ellipse cx="64" cy="64" rx="48" ry="28" fill="none" stroke="url(#eyeGradient)" stroke-width="4"/>

  <!-- Iris -->
  <circle cx="64" cy="64" r="18" fill="url(#pupilGradient)"/>

  <!-- Pupil -->
  <circle cx="64" cy="64" r="9" fill="#0D2137"/>

  <!-- Highlight -->
  <circle cx="70" cy="58" r="4" fill="white" opacity="0.8"/>

  <!-- Eyelashes - top -->
  <path d="M 16 64 Q 8 56 12 48" stroke="url(#eyeGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 32 64 Q 24 52 28 44" stroke="url(#eyeGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 48 64 Q 44 50 48 42" stroke="url(#eyeGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 64 64 Q 64 48 68 40" stroke="url(#eyeGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 80 64 Q 84 50 80 42" stroke="url(#eyeGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 96 64 Q 104 52 100 44" stroke="url(#eyeGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 112 64 Q 120 56 116 48" stroke="url(#eyeGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
